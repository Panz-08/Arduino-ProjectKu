name: 'Monitor Suhu Web ESP32 - WiFi dan alarm'
version: 1
author: 'Panz-08'

steps:
  - wait-serial: 'WiFi terhubung'
  - wait-serial: 'Web server aktif pada port 80.'
  - wait-serial: 'Suhu='

  # Suhu dinaikkan melewati batas 35 C
  - set-control:
      part-id: dht
      name: temperature
      value: 36
  - wait-serial: 'PERINGATAN: suhu di atas batas 35 C!'
