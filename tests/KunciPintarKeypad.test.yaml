name: 'Kunci Pintar Keypad - PIN benar dan salah'
version: 1
author: 'Panz-08'

steps:
  - wait-serial: 'PIN default: 1234'

  # PIN benar lewat Serial Monitor (jalur debug)
  - write-serial: '1234#'
  - wait-serial: 'AKSES DIBERIKAN'
  - wait-serial: 'Pintu dikunci kembali.'

  # PIN salah
  - write-serial: '9999#'
  - wait-serial: 'PIN salah (1/3).'
