name: 'Alarm Gerak PIR - deteksi gerakan'
version: 1
author: 'Panz-08'

steps:
  - wait-serial: 'Sistem AKTIF'

  # Sensor PIR Wokwi belum punya kontrol otomasi, jadi pakai perintah uji
  # bawaan sketch: ketik 'M' untuk mensimulasikan gerakan.
  - write-serial: 'M'
  - wait-serial: 'ALARM: gerakan terdeteksi!'

  # Gerakan berhenti -> alarm berhenti otomatis setelah 3 detik
  - wait-serial: 'Alarm berhenti: area kembali aman.'
