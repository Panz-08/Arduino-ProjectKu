name: 'Lampu Lalu Lintas - permintaan pejalan kaki'
version: 1
author: 'Panz-08'

steps:
  - wait-serial: 'FASE: HIJAU'

  # Tekan tombol penyeberangan
  - set-control:
      part-id: tombol
      name: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: tombol
      name: pressed
      value: 0

  # Tunggu hingga fase merah khusus pejalan kaki
  - wait-serial: 'FASE: MERAH - pejalan kaki boleh menyeberang'

  # Lalu kembali ke hijau
  - wait-serial: 'FASE: HIJAU'
